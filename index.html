<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marta Public Workspace</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-align: center;
      padding: 2rem;
    }
    .container { max-width: 600px; }
    h1 { font-family: 'Fredoka One', cursive; font-size: 3rem; margin-bottom: 0.5rem; }
    p { font-size: 1.1rem; opacity: 0.9; line-height: 1.6; margin-bottom: 2rem; }
    .divider { width: 60px; height: 3px; background: rgba(255,255,255,0.4); margin: 1rem auto; border-radius: 2px; }
    .links { display: flex; flex-direction: column; gap: 1rem; }
    .links a {
      display: inline-block;
      padding: 1rem 2rem;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 14px;
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.1rem;
      transition: all 0.3s ease;
    }
    .links a:hover { background: rgba(255,255,255,0.25); transform: translateY(-3px); }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌿 Marta Public Workspace</h1>
    <div class="divider"></div>
    <p>Páginas compartidas — proyectos, viajes, y cosas divertidas.</p>
    <div class="links">
      <a href="/marta-public-workspace/cataratas/">🌿 Cataratas Here We Come! →</a>
    </div>
  </div>
</body>
</html>
